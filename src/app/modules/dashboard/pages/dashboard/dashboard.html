<section class="dashboard">
  <div class="dashboard-header">
    <h1>Bienvenido a Mi Negocio</h1>
  </div>

  <div class="stats-grid">
    <app-stat-card title="Productos" value="1,234" label="Total en inventario" icon="inventory_2" color="blue"/>
    <app-stat-card title="Clientes" value="567" label="Clientes activos" icon="groups" color="green"/>
    <app-stat-card title="Ventas" value="$45,890" label="Este mes" icon="payments" color="purple"/>
    <app-stat-card title="Crecimiento" value="+23%" label="vs mes anterior" icon="trending_up" color="orange"/>
  </div>

  <h2 class="section-title">Acciones rápidas</h2>

  <div class="action-cards">
    <app-action-card
      title="Productos"
      description="Gestiona tu inventario completo"
      route="/products"
      icon="inventory_2"
      variant="products"
    />

    <app-action-card
      title="Clientes"
      description="Administra tus clientes"
      route="/customers"
      icon="groups"
      variant="clients"
    />

    <app-action-card
      title="Ventas"
      description="Controla tus ventas"
      route="/sales"
      icon="payments"
      variant="sales"
    />
  </div>

</section>
